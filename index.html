<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buku Kas &amp; Ronda RT 02 / RW 10</title>
<meta name="theme-color" content="#173F34">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Kas RT02">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--kertas:#EDF1EE;--lembar:#FBFCFA;--tinta:#17323B;--tinta2:#51676E;--garis:#C5D2CC;--garis2:#DDE6E1;--hijau:#1F5E4B;--onhijau:#fff;--hijau2:#DFEDE6;--biru:#2347A8;--biru2:#E3E9F7;--merah:#B3261E;--merah2:#F8E2E0;--kuning2:#FBF1C7;--stabilo:#F4DD5B;--onstabilo:#2B2500;--nav:#173F34;--onnav:#E8F1EC;--font:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--judul:'Bitter',Georgia,'Times New Roman',serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--kertas:#0E1A1D;--lembar:#152428;--tinta:#E4EDEA;--tinta2:#9EB2AC;--garis:#30454C;--garis2:#233840;--hijau:#58B895;--onhijau:#06231A;--hijau2:#183B30;--biru:#93ABF6;--biru2:#1A2546;--merah:#F28C84;--merah2:#3C1D1B;--kuning2:#3A3411;--stabilo:#E9D04B;--nav:#0A2B23;--onnav:#E3EEE9;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--kertas);color:var(--tinta);font-family:var(--font);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--judul);margin:0;line-height:1.2}
h2{font-size:1.5rem}
h3{font-size:1.1rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--biru);outline-offset:2px}
small{color:var(--tinta2)}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.nav{background:var(--nav);color:var(--onnav);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.label{background:#F6F3E6;color:#16302A;border:2px solid #16302A;outline:1px solid #16302A;outline-offset:-6px;padding:12px 10px;text-align:center;margin:2px 2px 14px;border-radius:2px}
.label .l1{font-family:var(--judul);font-weight:700;letter-spacing:.14em;font-size:.95rem}
.label .l2{font-family:var(--judul);font-weight:700;font-size:1.35rem;line-height:1.2;margin:2px 0}
.label .l3{font-size:.75rem}
.nav a{display:block;color:var(--onnav);text-decoration:none;padding:8px 12px;border-left:4px solid transparent;border-radius:0 3px 3px 0;cursor:pointer;white-space:nowrap}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:rgba(255,255,255,.12);border-left-color:var(--stabilo);font-weight:600}
.nav .gap{flex:1}
.nav .usr{font-size:.85rem;padding:10px 12px;border-top:1px solid rgba(255,255,255,.2)}
.nav .usr button{margin-top:6px;background:transparent;border:1px solid rgba(255,255,255,.5);color:var(--onnav);border-radius:3px;padding:4px 10px;cursor:pointer}
.nav a.kunci{opacity:.55}
.nav .nxt{font-size:.8rem;padding:6px 12px;background:var(--stabilo);color:var(--onstabilo);border-radius:3px;margin:6px 0}
main{padding:22px 28px 60px;max-width:1240px;width:100%}
.ph{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.ph p{margin:2px 0 0;color:var(--tinta2)}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lembar{background:var(--lembar);border:1px solid var(--garis);border-radius:3px;padding:16px;margin-bottom:16px}
.lembar>h3{margin-bottom:10px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.btn{border:1px solid var(--tinta);background:var(--lembar);padding:7px 13px;border-radius:3px;cursor:pointer;font-weight:500;line-height:1.3}
.btn:hover{background:var(--hijau2)}
.btn.utama{background:var(--hijau);color:var(--onhijau);border-color:var(--hijau)}
.btn.utama:hover{filter:brightness(1.1)}
.btn.bahaya{color:var(--merah);border-color:var(--merah)}
.btn.kecil{padding:3px 9px;font-size:.84rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--garis);margin-bottom:14px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;cursor:pointer;white-space:nowrap;color:var(--tinta2)}
.tabs button.kunci{opacity:.55}
.tabs button.on{border-bottom-color:var(--hijau);color:var(--tinta);font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
.bar .sp{flex:1}
.flt{display:flex;flex-direction:column;font-size:.8rem;color:var(--tinta2)}
.flt select,.cari{border:1px solid var(--garis);background:var(--lembar);padding:7px 9px;border-radius:3px;color:var(--tinta);min-width:120px}
.cari{min-width:220px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:600;padding:8px 10px;border-top:2px solid var(--tinta);border-bottom:1px solid var(--tinta);white-space:nowrap;font-size:.9rem}
td{padding:7px 10px;border-bottom:1px solid var(--garis2);vertical-align:top}
tbody tr:hover td{background:var(--hijau2)}
.r{text-align:right}
.c{text-align:center}
.kosong{text-align:center;color:var(--tinta2);padding:24px}
tr.tot td{font-weight:700;border-top:1px solid var(--tinta);border-bottom:3px double var(--tinta)}
tr.tot:hover td{background:none}
.aksi{white-space:nowrap;text-align:right}
.aksi .btn{margin-left:4px}
.mx td,.mx th{padding:5px 6px;text-align:center}
.mx td:first-child,.mx th:first-child{position:sticky;left:0;background:var(--lembar);text-align:left;z-index:1;min-width:150px}
.mx .sel{border:0;background:none;cursor:pointer;font-weight:700;padding:2px 6px;border-radius:3px}
.sel.ok{color:var(--biru)}
.sel.no{color:var(--merah);background:var(--merah2)}
.sel.na{color:var(--tinta2);cursor:default}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:.78rem;background:var(--garis2);white-space:nowrap}
.chip.h{background:var(--hijau2);color:var(--hijau)}
.chip.i{background:var(--kuning2);color:var(--tinta)}
.chip.t{background:var(--merah2);color:var(--merah)}
.chip.a{background:var(--biru2);color:var(--biru)}
.stempel{display:inline-block;border:2px solid;padding:0 8px;border-radius:3px;font-weight:700;letter-spacing:.08em;font-size:.72rem;transform:rotate(-4deg)}
.stempel.lunas{color:var(--biru)}
.stempel.tunggak{color:var(--merah)}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--hijau2);color:var(--hijau);display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:3px;border:1px solid var(--garis);cursor:pointer}
.stabilo{background:var(--stabilo);color:var(--onstabilo);padding:12px 14px;border-radius:3px;margin-bottom:16px}
.stabilo b{font-family:var(--judul)}
.stabilo ul{margin:6px 0 0;padding-left:18px}
.stabilo .btn{background:rgba(255,255,255,.55);border-color:var(--onstabilo);color:var(--onstabilo)}
.notice{background:var(--kuning2);border:1px solid var(--garis);padding:8px 12px;border-radius:3px;margin-bottom:14px;font-size:.88rem}
.sabtu{border:1px solid var(--garis);border-radius:3px;background:var(--lembar);margin-bottom:12px}
.sabtu>header{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:2px solid var(--tinta);background:var(--hijau2)}
.sabtu>header h3{font-size:1.05rem}
.sabtu .isi{padding:4px 14px 10px}
.sabtu.dekat>header{background:var(--stabilo);color:var(--onstabilo)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.kv dt{color:var(--tinta2)}.kv dd{margin:0}
.rules{border-left:4px solid var(--merah);padding:6px 12px;background:var(--merah2);margin-bottom:12px;font-size:.9rem}
/* modal */
#modal,#modal2{position:relative;z-index:50}
.ov{position:fixed;inset:0;background:rgba(10,25,28,.55);display:flex;align-items:flex-start;justify-content:center;padding:18px 10px;overflow:auto}
.dlg{background:var(--lembar);border-radius:6px;width:min(560px,100%);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.dlg.wide{width:min(820px,100%)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--garis)}
.dh .x{background:none;border:0;font-size:1.6rem;line-height:1;cursor:pointer}
.db{padding:14px 16px;max-height:68vh;overflow:auto}
.df{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--garis);align-items:center}
.df .sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:.88rem;min-width:0}
.fld>span,.fld>legend{color:var(--tinta2);font-weight:500}
.fld input,.fld select,.fld textarea{border:1px solid var(--garis);background:var(--kertas);padding:8px 10px;border-radius:3px;width:100%}
.full{grid-column:1/-1}
fieldset.fld{border:1px solid var(--garis);border-radius:3px;margin:0;padding:8px 10px}
.mcg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 10px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.92rem}
.chk input{margin-top:4px}
.chk.off{opacity:.55}
.chk small{display:block}
.req{color:var(--merah)}
.info{grid-column:1/-1;font-size:.9rem;background:var(--hijau2);padding:8px 12px;border-radius:3px}
.info.warn{background:var(--kuning2)}
.ferr{color:var(--merah);margin:10px 0 0;font-weight:600;min-height:1.2em}
.fpv{display:flex;gap:10px;align-items:center;margin-top:4px}
.fpv img{max-height:70px;border-radius:3px;border:1px solid var(--garis)}
.arow{grid-column:1/-1;display:grid;grid-template-columns:minmax(120px,1.2fr) minmax(130px,1fr) 2fr;gap:6px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--garis2)}
.arow .opt{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.88rem}
.lb{max-width:100%;max-height:70vh;display:block;margin:0 auto}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:80;pointer-events:none}
#toast div{background:var(--tinta);color:var(--kertas);padding:9px 16px;border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#toast div.err{background:var(--merah);color:#fff}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.login .kartu{width:min(440px,100%);background:var(--lembar);border:1px solid var(--garis);border-radius:3px;padding:22px}
.login .label{margin:0 0 16px}
.pilih{display:grid;gap:8px}
.pilih button{text-align:left;padding:12px 14px;border:1px solid var(--tinta);background:var(--lembar);border-radius:3px;cursor:pointer}
.pilih button:hover{background:var(--hijau2)}
.pilih button b{display:block}
.pilih button span{font-size:.85rem;color:var(--tinta2)}
.hint{font-size:.82rem;color:var(--tinta2);margin-top:10px}
#printArea{display:none}
.syn{display:inline-block;font-size:.76rem;padding:1px 9px;border-radius:10px;margin-bottom:4px;background:rgba(255,255,255,.18)}
.syn.online{background:#2E7D5B;color:#fff}.syn.offline,.syn.menyambung{background:var(--stabilo);color:var(--onstabilo)}.syn.ditolak{background:var(--merah);color:#fff}
.lembar .syn{background:var(--garis2);color:var(--tinta)}.lembar .syn.online{background:var(--hijau2);color:var(--hijau)}
pre.kode{background:var(--kertas);border:1px solid var(--garis);padding:10px;border-radius:3px;overflow-x:auto;font-size:.82rem;white-space:pre-wrap;word-break:break-all}
ol.lg{padding-left:20px;margin:6px 0 12px}ol.lg li{margin-bottom:4px}
@media(max-width:860px){
 .shell{display:block}
 .nav{height:auto;position:sticky;top:0;z-index:20;flex-direction:row;align-items:center;overflow-x:auto;padding:8px;gap:2px}
 .nav .label{display:none}
 .nav .gap{display:none}
 .nav .usr{border:0;padding:0 6px;white-space:nowrap;display:flex;align-items:center;gap:8px}
 .nav .usr button{margin:0}
 .nav .nxt{display:none}
 .nav a{border-left:0;border-bottom:3px solid transparent;border-radius:0;padding:8px 10px}
 .nav a.on{border-bottom-color:var(--stabilo)}
 main{padding:14px 12px 50px}
 .arow{grid-template-columns:1fr}
}
@media print{
 body{background:#fff}
 #app,#modal,#modal2,#toast{display:none!important}
 #printArea{display:block;font-family:'Times New Roman',Georgia,serif;color:#000;font-size:11pt}
 #printArea .kop{text-align:center;border-bottom:3px double #000;padding-bottom:6px;margin-bottom:10px;line-height:1.35}
 #printArea .kop b{font-size:14pt;letter-spacing:.04em}
 #printArea h2.pj{text-align:center;font-size:13pt;margin:8px 0 2px;font-family:inherit;text-transform:uppercase}
 #printArea p.ps{text-align:center;margin:0 0 10px}
 #printArea h3{font-size:11.5pt;margin:12px 0 4px;font-family:inherit}
 #printArea table{width:100%;border-collapse:collapse;margin:4px 0 10px;font-size:9.5pt;color:#000}
 #printArea th,#printArea td{border:1px solid #000;padding:3px 6px;text-align:left;background:none!important;color:#000}
 #printArea th{background:#e6e6e6!important}
 #printArea .r{text-align:right}
 #printArea .c{text-align:center}
 #printArea tr.tot td{font-weight:700}
 #printArea .tw{overflow:visible}
 #printArea .chip,#printArea .stempel{border:0;padding:0;background:none;transform:none;color:#000;font-size:inherit;letter-spacing:0}
 #printArea tr{page-break-inside:avoid}
 #printArea .ttd{margin-top:22px;page-break-inside:avoid}
 #printArea .ttd p{text-align:right;margin:0 0 8px}
 #printArea .ttdg{display:flex;justify-content:space-between;text-align:center}
 #printArea .ttdg>div{width:32%}
 #printArea .ttn{margin-top:62px;font-weight:700;text-decoration:underline}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="modal2"></div>
<div id="toast" aria-live="polite"></div>
<div id="printArea"></div>
<noscript>Aplikasi ini membutuhkan JavaScript.</noscript>
<script>
(function(){
'use strict';
/* ================= util ================= */
const $=(s,r=document)=>r.querySelector(s);
const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BLN=BULAN.map(b=>b.slice(0,3));
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const uid=()=>'i'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp '+Math.round(+n||0).toLocaleString('id-ID');
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>iso(new Date());
const tgl=s=>{if(!s)return '';const d=parse(s);return d.getDate()+' '+BULAN[d.getMonth()]+' '+d.getFullYear()};
const tglHari=s=>HARI[parse(s).getDay()]+', '+tgl(s);
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const isSabtu=s=>!!s&&parse(s).getDay()===6;
const nextSabtu=s=>{const d=parse(s);d.setDate(d.getDate()+((6-d.getDay()+7)%7));return iso(d)};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/86400000);
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const unique=a=>[...new Set(a.filter(Boolean))];
const byRumah=(a,b)=>String(a.rumah).localeCompare(String(b.rumah),'id',{numeric:true});
const byNama=(a,b)=>a.nama.localeCompare(b.nama,'id');
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const curY=()=>new Date().getFullYear();
const curM=()=>new Date().getMonth()+1;

/* ================= penyimpanan ================= */
const KEY='sikas_rt_v1',SKEY='sikas_rt_sesi',SAYA='sikas_rt_saya';
let persist=true;const mem={};
function sget(k){try{return localStorage.getItem(k)}catch(e){persist=false;return mem[k]==null?null:mem[k]}}
function sset(k,v){try{localStorage.setItem(k,v);return true}catch(e){mem[k]=v;if(e&&(e.name==='QuotaExceededError'||e.code===22)){toast('Penyimpanan penuh. Hapus beberapa gambar/file atau unduh cadangan.','err')}else{persist=false}return false}}
(function(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){persist=false}})();
/* Isi di sini (lalu pasang file di hosting) agar semua HP otomatis tersambung tanpa tautan undangan */
const SYNC_DEFAULT={url:'',kode:''};
const CFGKEY='sikas_rt_sync';
const sync={cfg:null,state:'mati',es:null,rt:{},base:new Map(),first:true,timer:null,retry:null,rtimer:null,pushing:false};
function cacheLocal(){sset(KEY,JSON.stringify(db))}
function simpan(){cacheLocal();schedulePush()}

/* ================= data awal ================= */
/* ===== katalog menu & sub menu. Menu/sub menu BARU yang ditambahkan nanti otomatis terkunci
   untuk admin dan warga sampai super user mencentangnya di Pengaturan > Akses menu ===== */
const TAB_IURAN=[['matrix','Iuran bulanan'],['bayar','Pembayaran'],['tunggak','Rekap tunggakan']];
const TAB_RONDA=[['mingguan','Jadwal mingguan'],['jimpitan','Jimpitan'],['jadwal','Kelola jadwal'],['kehadiran','Kehadiran'],['rekap','Rekap anggota'],['anggota','Anggota & kelompok']];
const KATALOG=[['warga','Warga',[]],['iuran','Iuran',TAB_IURAN],['kas','Buku kas',[]],['laporan','Laporan',[]],['aset','Aset RT',[]],['dokumen','Dokumen',[]],['ronda','Ronda',TAB_RONDA]];
const semuaKunci=()=>KATALOG.flatMap(([k,l,s])=>[k,...s.map(x=>k+'.'+x[0])]);
const KUNCI_AWAL=['warga','iuran','iuran.matrix','iuran.bayar','iuran.tunggak','kas','laporan','aset','dokumen','ronda','ronda.mingguan','ronda.jimpitan','ronda.jadwal','ronda.kehadiran','ronda.rekap','ronda.anggota'];
const csvL=s=>(typeof s==='string'&&s)?s.split(','):[];
function aksesData(){const a=db.settings.akses;if(a&&typeof a==='object')return{known:csvL(a.known),admin:csvL(a.admin),warga:csvL(a.warga)};return{known:KUNCI_AWAL,admin:KUNCI_AWAL,warga:KUNCI_AWAL}}
function aksesOk(role,key){const d=aksesData();return d.known.includes(key)&&d[role].includes(key)}
function defSettings(){return{nama:'',rt:'02',rw:'10',kelurahan:'',kecamatan:'',kota:'',alamat:'',periode:'',ketua:'',wakil:'',bendahara:'',sekretaris:'',ketuaRW:'',koordinator:'',koordinatorHp:'',iuran:50000,denda:20000,batasBayar:10,saldoAwal:0,saldoAwalTgl:'',tahunMulai:curY(),kategori:['Kebersihan & kerja bakti','Keamanan & ronda','Sosial & santunan','Perayaan & kegiatan warga','Perbaikan fasilitas','Konsumsi rapat','ATK & administrasi','Lain-lain'],kategoriMasuk:['Sumbangan warga','Donasi','Sewa aset RT','Lain-lain'],kelompok:['Kelompok 1','Kelompok 2','Kelompok 3'],sesi:['22:00–01:00','01:00–04:00'],menuTutup:[],pinSuper:'123456'}}
function kosong(){return{v:1,settings:defSettings(),warga:[],aset:[],payments:[],kas:[],dokumen:[],anggota:[],jadwal:[]}}
const cmpJ=(a,b,D)=>{D=D||db;const sx=D.settings.sesi;return a.tanggal.localeCompare(b.tanggal)||(sx.indexOf(a.sesi)-sx.indexOf(b.sesi))||String(a.pos).localeCompare(String(b.pos))};
function genJadwal(D,mulai,minggu){

/* ================= perhitungan ================= */
function jatuhTempo(w){
  const cy=curY(),cm=curM(),lewat=new Date().getDate()>=(+db.settings.batasBayar||1);
  let sy=+db.settings.tahunMulai||cy,sm=1;if(w.mulai&&/^\d{4}-\d{2}$/.test(w.mulai)){[sy,sm]=w.mulai.split('-').map(Number)}
  const out=[];for(let y=sy;y<=cy;y++)for(let m=(y===sy?sm:1);m<=(y===cy?(lewat?cm:cm-1):12);m++)out.push({y,m});return out;
}
function tunggakanData(fy){
  const paid=new Set(db.payments.map(p=>`${p.wargaId}|${p.tahun}|${p.bulan}`));
  return db.warga.filter(w=>!tanpaIuran(w)).sort(byRumah).map(w=>{const list=jatuhTempo(w).filter(x=>(!fy||x.y===fy)&&!paid.has(`${w.id}|${x.y}|${x.m}`));return{w,list,total:list.length*nominal(w)}}).filter(r=>r.list.length);
}
function ringkasBulan(list){const g={};list.forEach(x=>{(g[x.y]=g[x.y]||[]).push(BLN[x.m-1])});return Object.entries(g).map(([y,a])=>a.join(', ')+' '+y).join('; ')}
function ledger(){
  const rows=[],s=db.settings;
  db.payments.forEach(p=>{const w=db.warga.find(x=>x.id===p.wargaId);rows.push({tanggal:p.tanggal,jenis:'masuk',kategori:'Iuran bulanan',uraian:`${p.tg?'Bayar tunggakan iuran':'Iuran'} ${w?w.nama+' (No. '+w.rumah+')':'warga'} – ${BULAN[p.bulan-1]} ${p.tahun}${p.tg?' (bayar tunggakan)':''}`,jumlah:+p.jumlah,auto:true,col:'payments',id:p.id,bukti:p.bukti})});
  db.jadwal.forEach(j=>Object.entries(j.absen||{}).forEach(([aid,r])=>{if((r.status==='izin'||r.status==='tidak')&&r.lunas)rows.push({tanggal:r.tglLunas||j.tanggal,jenis:'masuk',kategori:'Denda ronda',uraian:`Denda ronda ${namaAg(aid)} (${r.status==='izin'?'izin':'tidak hadir'}) – ${tgl(j.tanggal)}`,jumlah:+(r.denda||s.denda),auto:true,col:'jadwal',id:j.id,bukti:null})}));
  db.kas.forEach(k=>rows.push({tanggal:k.tanggal,jenis:k.jenis,kategori:k.kategori,uraian:k.uraian,jumlah:+k.jumlah,auto:false,col:'kas',id:k.id,bukti:k.bukti}));
  rows.sort((a,b)=>a.tanggal.localeCompare(b.tanggal)||(a.jenis===b.jenis?0:a.jenis==='masuk'?-1:1));
  return rows;
}
const net=a=>a.reduce((t,r)=>t+(r.jenis==='masuk'?r.jumlah:-r.jumlah),0);
const saldoTotal=()=>(+db.settings.saldoAwal||0)+net(ledger());
function hitungLap(y,m){
  const rows=ledger(),start=m?`${y}-${pad(m)}-01`:`${y}-01-01`,end=m?(m===12?`${y+1}-01-01`:`${y}-${pad(m+1)}-01`):`${y+1}-01-01`;
  const before=rows.filter(r=>r.tanggal<start),per=rows.filter(r=>r.tanggal>=start&&r.tanggal<end);
  const mk=per.filter(r=>r.jenis==='masuk'),kl=per.filter(r=>r.jenis==='keluar');
  const grp=a=>{const o={};a.forEach(r=>o[r.kategori]=(o[r.kategori]||0)+r.jumlah);return Object.entries(o).sort((p,q)=>q[1]-p[1])};
  const awal=(+db.settings.saldoAwal||0)+net(before),tm=sum(mk,r=>r.jumlah),tk=sum(kl,r=>r.jumlah);
  return{y,m,per,awal,masuk:tm,keluar:tk,akhir:awal+tm-tk,gm:grp(mk),gk:grp(kl)};
}
function berikutnya(){const t=today(),up=db.jadwal.filter(j=>j.tanggal>=t).sort(cmpJ);if(!up.length)return null;const tg=up[0].tanggal;return{tanggal:tg,hari:diffDays(tg,t),entries:up.filter(j=>j.tanggal===tg)}}
const hariTxt=h=>h===0?'Malam ini':h===1?'Besok malam':h+' hari lagi';
const dendaOf=r=>+(r&&r.denda)||+db.settings.denda;
const isDenda=r=>r&&(r.status==='izin'||r.status==='tidak');

  const kat=jenis==='masuk'?db.settings.kategoriMasuk:db.settings.kategori;

    fields:[{name:'tanggal',label:'Tanggal',type:'date',req:true},{name:'kategori',label:jenis==='masuk'?'Kategori penerimaan':'Kategori kegiatan',type:'select',options:unique([...kat,k&&k.kategori])},{name:'uraian',label:'Uraian',type:'text',req:true,full:true},{name:'jumlah',label:'Jumlah (Rp)',type:'number',req:true,min:1},{name:'bukti',label:'Bukti / kwitansi (gambar atau PDF)',type:'file'}],

act.kasMasuk=()=>formKas('masuk');act.kasKeluar=()=>formKas('keluar');act.kasUbah=d=>formKas(null,d.id);

/* ================= laporan ================= */
function laporanHTML(){
  const Y=+ui.f.ly,bln=ui.f.lj==='bulanan',Mo=bln?+ui.f.lm:0,L=hitungLap(Y,Mo),s=db.settings;
  const per=bln?`Bulan ${BULAN[Mo-1]} ${Y}`:`Tahun ${Y}`;
  let h=`<h3>A. Ringkasan</h3>`+T(['Uraian',{t:'Jumlah',c:'r'}],[[`Saldo awal ${per.toLowerCase()}`,R(L.awal)],['Total penerimaan',R(L.masuk)],['Total pengeluaran',R(L.keluar)]],{foot:['Saldo akhir',R(L.akhir)]});
  h+=`<h3>B. Penerimaan</h3>`+T(['Kategori',{t:'Jumlah',c:'r'}],L.gm.map(([k,v])=>[esc(k),R(v)]),{empty:'Tidak ada penerimaan.',foot:['Total penerimaan',R(L.masuk)]});
  h+=`<h3>C. Pengeluaran kegiatan lingkungan</h3>`+T(['Kategori',{t:'Jumlah',c:'r'}],L.gk.map(([k,v])=>[esc(k),R(v)]),{empty:'Tidak ada pengeluaran.',foot:['Total pengeluaran',R(L.keluar)]});
  if(bln){h+=`<h3>D. Rincian transaksi</h3>`+T(['Tanggal','Uraian','Kategori',{t:'Masuk',c:'r'},{t:'Keluar',c:'r'}],L.per.map(r=>[tgl(r.tanggal),esc(r.uraian),esc(r.kategori),r.jenis==='masuk'?R(r.jumlah):{t:'',c:'r'},r.jenis==='keluar'?R(r.jumlah):{t:'',c:'r'}]),{empty:'Tidak ada transaksi.',foot:['Total','','',R(L.masuk),R(L.keluar)]})}
  else{const rows=[];for(let m=1;m<=12;m++){const x=hitungLap(Y,m);rows.push([BULAN[m-1],R(x.awal),R(x.masuk),R(x.keluar),R(x.akhir)])}h+=`<h3>D. Rekap per bulan</h3>`+T(['Bulan',{t:'Saldo awal',c:'r'},{t:'Masuk',c:'r'},{t:'Keluar',c:'r'},{t:'Saldo akhir',c:'r'}],rows,{foot:['Setahun',R(L.awal),R(L.masuk),R(L.keluar),R(L.akhir)]})}
  const tg=tunggakanData(0);h+=`<h3>E. Tunggakan iuran per ${tgl(today())}</h3><p>${tg.length?`${tg.length} warga menunggak dengan total ${rp(sum(tg,r=>r.total))}.`:'Tidak ada tunggakan iuran.'}</p>`;
  return{html:h,per};
}
function pLaporan(){
  const {html,per}=laporanHTML(),bln=ui.f.lj==='bulanan';
  GEN.laporan=()=>laporanHTML().html;
  const d=expBtns('','Laporan keuangan '+per,'Laporan pertanggungjawaban • '+namaLing(),{gen:'laporan'});
  return ph('Laporan keuangan','Laporan pertanggungjawaban bulanan dan tahunan',d)+`<section class="lembar"><div class="bar">${selF('lj',[{v:'bulanan',t:'Bulanan'},{v:'tahunan',t:'Tahunan'}],'Jenis laporan')}${selF('ly',optTahun(false),'Tahun')}${bln?selF('lm',optBulan(false),'Bulan'):''}</div><h3 style="margin-bottom:8px">Laporan ${esc(per)}</h3><div id="lap">${html}</div><p><small>Tanda tangan Bendahara, Ketua RT, dan Ketua RW ikut tercetak. Nama diambil dari menu Pengaturan.</small></p></section>`;
}

/* ================= ronda ================= */
const statChip=r=>!r?'<span class="chip">belum dicatat</span>':r.status==='hadir'?'<span class="chip h">Hadir</span>':r.status==='izin'?`<span class="chip i">Izin${r.lapor?'':' (belum lapor)'}</span>`:'<span class="chip t">Tidak hadir</span>';
const petugasTxt=j=>j.petugas.map(id=>esc(namaAg(id))+(id===j.koordinator?' (K)':'')).join(', ')||'<small>belum ada petugas</small>';
function jadwalFiltered(){const Y=+ui.f.ry,Mo=+ui.f.rb;return db.jadwal.filter(j=>(!Y||+j.tanggal.slice(0,4)===Y)&&(!Mo||+j.tanggal.slice(5,7)===Mo)).sort(cmpJ)}
function pRonda(){
  const t=curTab('ronda','mingguan',TAB_RONDA),s=db.settings;
  const aturan=`<div class="rules">Ronda setiap <b>Sabtu malam (malam Minggu)</b>. Izin atau tidak hadir <b>wajib memberi tahu koordinator ronda${s.koordinator?` (${esc(s.koordinator)}${s.koordinatorHp?', '+esc(s.koordinatorHp):''})`:''}</b> dan dikenai denda <b>${rp(s.denda)}</b>.</div>`;

  return ph('Ronda lingkungan','Jadwal piket, kehadiran, dan denda')+banner()+aturan+tabs('ronda',TAB_RONDA)+body;

function jadwalSaya(){
  const opts=[{v:'',t:'— pilih nama —'},...db.anggota.slice().sort(byNama).map(a=>({v:a.id,t:a.nama}))];
  let info='';const id=ui.f.saya;
  if(id){const nx=db.jadwal.filter(j=>j.tanggal>=today()&&j.petugas.includes(id)).sort(cmpJ)[0];info=nx?`<b>${esc(tglHari(nx.tanggal))}</b> (${hariTxt(diffDays(nx.tanggal,today()))}), sesi ${esc(nx.sesi)}, ${esc(nx.pos)}.`:'Belum ada jadwal piket berikutnya.'}
  return `<div class="bar">${selF('saya',opts,'Cek piket saya')}<div style="padding-bottom:8px">${info}</div></div>`;
}
function tabMingguan(){
  const first=addDays(nextSabtu(today()),ui.minggu*28),dates=[0,1,2,3].map(i=>addDays(first,i*7)),t=today();
  GEN.jadwalMendatang=()=>{const rows=db.jadwal.filter(j=>j.tanggal>=t&&j.tanggal<=addDays(t,60)).sort(cmpJ).map(j=>[tglHari(j.tanggal),esc(j.sesi),esc(j.pos),esc(j.kelompok),petugasTxt(j)]);return T(['Tanggal','Sesi','Pos','Kelompok','Petugas (K = koordinator)'],rows,{empty:'Belum ada jadwal.'})};
  return `<section class="lembar">${jadwalSaya()}<div class="bar">${btn('mingguGeser','← 4 minggu sebelumnya','data-n="-1"','kecil')}${btn('mingguGeser','Hari ini','data-n="0"','kecil')}${btn('mingguGeser','4 minggu berikutnya →','data-n="1"','kecil')}<span class="sp"></span>${expBtns('','Jadwal ronda 2 bulan ke depan',namaLing(),{gen:'jadwalMendatang',ttd:false})}</div>
  ${dates.map(d=>{const es=db.jadwal.filter(j=>j.tanggal===d).sort(cmpJ),h=diffDays(d,t);
    return `<article class="sabtu${h>=0&&h<=3?' dekat':''}"><header><h3>${esc(tglHari(d))}</h3><span>${h<0?'sudah lewat':hariTxt(h)}${(()=>{const jm=sum(db.kas.filter(k=>isJimp(k)&&k.tanggal===d),k=>+k.jumlah);return jm?' • Jimpitan '+rp(jm):''})()} ${can()?btn('jimpitanBaru','Catat jimpitan',`data-t="${d}"`,'kecil'):''}</span></header><div class="isi">${es.length?T(['Sesi','Pos','Kelompok','Petugas (K = koordinator)'],es.map(j=>[esc(j.sesi),esc(j.pos),esc(j.kelompok),j.petugas.map(id=>esc(namaAg(id))+(id===j.koordinator?' (K)':'')+(j.absen[id]?' '+statChip(j.absen[id]):'')).join('<br>')||'–'])):`<p>Belum ada jadwal. ${can()?btn('jadwalBaru','Tambah jadwal','','kecil'):''}</p>`}</div></article>`}).join('')}</section>`;
}

/* ---- jimpitan / perelek ronda: otomatis masuk kas masuk ---- */
const isJimp=k=>k.jenis==='masuk'&&(k.jimpitan||k.kategori==='Jimpitan ronda');
function jimpRows(){const Y=+ui.f.ry,Mo=+ui.f.rb;return db.kas.filter(k=>isJimp(k)&&(!Y||+k.tanggal.slice(0,4)===Y)&&(!Mo||+k.tanggal.slice(5,7)===Mo)).sort((a,b)=>b.tanggal.localeCompare(a.tanggal))}
function tabJimpitan(){
  const rows=jimpRows(),per=(+ui.f.rb?BULAN[ui.f.rb-1]+' ':'')+(+ui.f.ry||'semua tahun');
  return `<section class="lembar"><p>Uang jimpitan (perelek) yang terkumpul saat ronda. Setiap catatan otomatis masuk ke <b>kas masuk</b> dan menambah saldo kas.</p>${filterBar((can()?btn('jimpitanBaru','Catat jimpitan','','utama'):'')+expBtns('#tbl-jimp','Jimpitan ronda',per,{ttd:false}))}<div id="tbl-jimp">${T(['Tanggal ronda','Kelompok','Keterangan',{t:'Jumlah',c:'r'},{t:'',c:'aksi'}],rows.map(k=>[esc(tglHari(k.tanggal)),esc(k.kelompok||'–'),esc(k.ket||''),R(k.jumlah),aksiCell('kas',k.id,'catatan jimpitan','jimpitanUbah')]),{empty:'Belum ada catatan jimpitan pada periode ini.',foot:[`${rows.length} catatan`,'','',R(sum(rows,k=>+k.jumlah)),'']})}</div></section>`;
}
function kelompokTgl(t){const e=db.jadwal.filter(x=>x.tanggal===t).sort(cmpJ)[0];return e?e.kelompok:''}
function formJimpitan(id,tanggal){
  const k=id?db.kas.find(x=>x.id===id):null;
  openForm({title:k?'Ubah jimpitan':'Catat jimpitan ronda',
    init:k?{tanggal:k.tanggal,kelompok:k.kelompok||'',jumlah:k.jumlah,ket:k.ket||''}:{tanggal:tanggal||today(),kelompok:kelompokTgl(tanggal||today()),jumlah:'',ket:''},
    fields:fs=>[{type:'info',html:'Uang jimpitan (perelek) otomatis masuk ke kas masuk dan menambah saldo kas.'},{name:'tanggal',label:'Tanggal ronda',type:'date',req:true,refresh:true},{name:'kelompok',label:'Kelompok yang bertugas',type:'select',options:[{v:'',t:'— tidak dicatat —'},...unique([...db.settings.kelompok,fs.kelompok])]},{name:'jumlah',label:'Jumlah terkumpul (Rp)',type:'number',req:true,min:1},{name:'ket',label:'Keterangan (opsional)',type:'text',full:true}],
    onChange:(n,fs)=>{if(n==='tanggal'&&!k)fs.kelompok=kelompokTgl(fs.tanggal)},
    validate:fs=>num(fs.jumlah)>0?null:'Jumlah harus lebih dari 0.',
    onSave:fs=>{const o={tanggal:fs.tanggal,jenis:'masuk',kategori:'Jimpitan ronda',uraian:'Jimpitan ronda '+tglHari(fs.tanggal)+(fs.kelompok?' – '+fs.kelompok:''),jumlah:num(fs.jumlah),jimpitan:true,kelompok:fs.kelompok,ket:fs.ket};
      if(k)Object.assign(k,o);else db.kas.push({id:uid(),...o});toast('Jimpitan '+rp(num(fs.jumlah))+' masuk kas')}});
}
act.jimpitanBaru=d=>formJimpitan(null,d&&d.t);act.jimpitanUbah=d=>formJimpitan(d.id);
act.mingguGeser=d=>{ui.minggu=+d.n===0?0:ui.minggu+ +d.n;render()};
function filterBar(extra){return `<div class="bar">${selF('ry',optTahun(true),'Tahun')}${selF('rb',optBulan(true),'Bulan')}<span class="sp"></span>${extra||''}</div>`}
function tabJadwal(){
  const rows=jadwalFiltered().map(j=>[tglHari(j.tanggal),esc(j.sesi),esc(j.pos),esc(j.kelompok),esc(j.koordinator?namaAg(j.koordinator):'–'),petugasTxt(j),aksiCell('jadwal',j.id,'jadwal '+tgl(j.tanggal),'jadwalUbah',btn('absen','Kehadiran',`data-id="${j.id}"`,'kecil'))]);
  const per=(+ui.f.rb?BULAN[ui.f.rb-1]+' ':'')+(+ui.f.ry||'semua tahun');
  return `<section class="lembar">${filterBar((can()?btn('jadwalAuto','Buat jadwal otomatis')+btn('jadwalBaru','Tambah jadwal','','utama'):'')+expBtns('#tbl-jadwal','Jadwal ronda',per,{land:true,ttd:false}))}<div id="tbl-jadwal">${T(['Tanggal','Sesi','Pos','Kelompok','Koordinator','Petugas',{t:'',c:'aksi'}],rows,{empty:'Belum ada jadwal pada periode ini.'})}</div></section>`;
}
function tabHadir(){
  const es=jadwalFiltered(),per=(+ui.f.rb?BULAN[ui.f.rb-1]+' ':'')+(+ui.f.ry||'semua tahun');
  GEN.kehadiran=()=>{const rows=[];es.forEach(j=>j.petugas.forEach(id=>{const r=j.absen[id],d=isDenda(r);rows.push([tglHari(j.tanggal),esc(j.sesi+' • '+j.pos),esc(namaAg(id)),r?({hadir:'Hadir',izin:'Izin',tidak:'Tidak hadir'})[r.status]:'Belum dicatat',d?(r.lapor?'Sudah':'Belum'):'–',d?R(dendaOf(r)):'–',d?(r.lunas?'Lunas':'Belum lunas'):'–'])}));
    return `<h3>Rincian kehadiran</h3>`+T(['Tanggal','Sesi / pos','Nama','Status','Lapor koordinator',{t:'Denda',c:'r'},'Denda lunas?'],rows,{empty:'Tidak ada data.'})+`<h3>Rekap per anggota</h3>`+rekapTable(rekapData())};
  const rows=es.map(j=>{const rs=j.petugas.map(id=>j.absen[id]),h=rs.filter(r=>r&&r.status==='hadir').length,iz=rs.filter(r=>r&&r.status==='izin').length,tt=rs.filter(r=>r&&r.status==='tidak').length,bl=rs.filter(r=>!r).length,den=sum(rs.filter(isDenda),dendaOf);
    return[tglHari(j.tanggal),esc(j.sesi+' • '+j.pos),esc(j.kelompok),{t:h,c:'r'},{t:iz,c:'r'},{t:tt,c:'r'},{t:bl,c:'r'},R(den),can()?{c:'aksi',t:btn('absen','Catat',`data-id="${j.id}"`,'kecil utama')}:{c:'aksi',t:''}]});
  return `<section class="lembar">${filterBar(expBtns('','Laporan kehadiran ronda',per,{gen:'kehadiran',land:true}))}<div id="tbl-hadir">${T(['Tanggal','Sesi / pos','Kelompok',{t:'Hadir',c:'r'},{t:'Izin',c:'r'},{t:'Tidak hadir',c:'r'},{t:'Belum dicatat',c:'r'},{t:'Denda',c:'r'},{t:'',c:'aksi'}],rows,{empty:'Belum ada jadwal pada periode ini.'})}</div></section>`;
}
function rekapData(){
  const es=jadwalFiltered().filter(j=>j.tanggal<=today());
  return db.anggota.slice().sort(byNama).map(a=>{let tugas=0,h=0,iz=0,tt=0,bl=0,den=0,belumLunas=0;
    es.forEach(j=>{if(!j.petugas.includes(a.id))return;tugas++;const r=j.absen[a.id];if(!r){bl++;return}if(r.status==='hadir')h++;if(r.status==='izin')iz++;if(r.status==='tidak')tt++;if(isDenda(r)){den+=dendaOf(r);if(!r.lunas)belumLunas+=dendaOf(r)}});
    return{a,tugas,h,iz,tt,bl,den,belumLunas,pct:(tugas-bl)>0?Math.round(h/(tugas-bl)*100):null}}).filter(r=>r.tugas>0||true);
}

    onSave:fs=>{const o={tanggal:fs.tanggal,sesi:fs.sesi,pos:fs.pos.trim(),kelompok:fs.kelompok,petugas:fs.petugas,koordinator:fs.koordinator,catatan:fs.catatan};if(j){Object.keys(j.absen).forEach(k=>{if(!o.petugas.includes(k))delete j.absen[k]});Object.assign(j,o)}else db.jadwal.push({id:uid(),absen:{},...o});toast('Jadwal tersimpan')},

act.simpanSetting=()=>{
  const s=db.settings,old={...s,kelompok:[...s.kelompok]},n={};
  document.querySelectorAll('[data-st]').forEach(el=>{const k=el.dataset.st;n[k]=el.dataset.list?el.value.split('\n').map(x=>x.trim()).filter(Boolean):(el.type==='number'?num(el.value):el.value)});
    if(String(n.pinSuper).length<4)return toast('PIN super user minimal 4 karakter.','err');
  if(!n.kelompok.length||!n.sesi.length)return toast('Kelompok dan sesi ronda tidak boleh kosong.','err');
  old.kelompok.forEach((k,i)=>{const nk=n.kelompok[i];if(nk&&nk!==k){db.anggota.forEach(a=>{if(a.kelompok===k)a.kelompok=nk});db.jadwal.forEach(j=>{if(j.kelompok===k)j.kelompok=nk})}else if(!nk){db.anggota.forEach(a=>{if(a.kelompok===k)a.kelompok=''})}});
  if(s.sesi.length===n.sesi.length)s.sesi.forEach((x,i)=>{if(x!==n.sesi[i])db.jadwal.forEach(j=>{if(j.sesi===x)j.sesi=n.sesi[i]})});
  {const ak={admin:[],warga:[]};document.querySelectorAll('[data-ak]').forEach(el=>{const[r,k]=el.dataset.ak.split('|');if(el.checked&&ak[r])ak[r].push(k)});n.akses={admin:ak.admin.join(','),warga:ak.warga.join(','),known:semuaKunci().join(',')}}
  Object.assign(s,n);simpan();render();toast('Pengaturan tersimpan');
};

function pulihDari(file){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d||!d.settings||!Array.isArray(d.warga))throw 0;konfirm('Ganti semua data saat ini dengan isi cadangan ini?',()=>{db=d;db.settings=Object.assign(defSettings(),db.settings);['warga','aset','payments','kas','dokumen','anggota','jadwal'].forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});simpan();render();toast('Data dipulihkan')},'Pulihkan')}catch(e){toast('File cadangan tidak valid.','err')}};fr.readAsText(file)}

act.kosongkan=()=>konfirm('Hapus SEMUA data (warga, kas, ronda, file)? Pengaturan identitas ikut kembali ke awal. Unduh cadangan dulu jika perlu.',()=>{db=kosong();simpan();render();toast('Semua data dikosongkan')},'Kosongkan');

/* ================= sinkronisasi antar HP (Firebase Realtime Database) ================= */
const LIST_KEYS=['kategori','kategoriMasuk','kelompok','sesi','menuTutup'];
const COLS=['warga','aset','payments','kas','dokumen','anggota','jadwal'];
const RULES='{\n  "rules": {\n    ".read": false,\n    ".write": false,\n    "sikas": {\n      "$kode": { ".read": true, ".write": true }\n    }\n  }\n}';
const arr=x=>Array.isArray(x)?x.filter(v=>v!=null):(x&&typeof x==='object'?Object.values(x):[]);
function sj(o){if(o===null||o===undefined)return undefined;if(Array.isArray(o)){const a=o.map(sj).filter(v=>v!==undefined);return a.length?'['+a.join(',')+']':undefined}
  if(typeof o==='object'){const p=[];Object.keys(o).sort().forEach(k=>{const v=sj(o[k]);if(v!==undefined)p.push(JSON.stringify(k)+':'+v)});return p.length?'{'+p.join(',')+'}':undefined}return JSON.stringify(o)}
function flatten(d){const m=new Map();Object.keys(d.settings).forEach(k=>{const j=sj(d.settings[k]);if(j!==undefined)m.set('settings/'+k,{j,v:d.settings[k]})});COLS.forEach(c=>d[c].forEach(r=>m.set(c+'/'+r.id,{j:sj(r),v:r})));return m}
function normRec(c,r){if(c==='jadwal'){r.petugas=arr(r.petugas);r.absen=r.absen||{};if(r.koordinator==null)r.koordinator='';if(r.catatan==null)r.catatan=''}return r}
function rtKeys(rt){const k=[];Object.keys(rt.settings||{}).forEach(x=>k.push('settings/'+x));COLS.forEach(c=>Object.keys(rt[c]||{}).forEach(id=>k.push(c+'/'+id)));return k}
function synLabel(){return{mati:'Sinkron belum aktif',menyambung:'Menyambung…',online:'Tersinkron',offline:'Offline, mencoba lagi',ditolak:'Ditolak server'}[sync.state]}
function setState(s){sync.state=s;document.querySelectorAll('.synT').forEach(el=>{el.textContent=synLabel();el.className=el.className.replace(/\b(mati|menyambung|online|offline|ditolak)\b/g,'').trim()+' '+s})}
function syncBase(){const c=sync.cfg;if(!c||!c.url||!c.kode)return null;return String(c.url).trim().replace(/\.json$/,'').replace(/\/+$/,'')+'/sikas/'+encodeURIComponent(c.kode)}
function stopSync(){if(sync.es){sync.es.close();sync.es=null}clearTimeout(sync.timer);clearTimeout(sync.retry)}
function startSync(){stopSync();const b=syncBase();if(!b){setState('mati');return}
  setState('menyambung');sync.first=true;sync.rt={};sync.base=new Map();
  try{sync.es=new EventSource(b+'.json')}catch(e){setState('offline');return}
  const es=sync.es;es.addEventListener('put',onSse);es.addEventListener('patch',onSse);
  es.onerror=()=>setState(es.readyState===2?'ditolak':'offline');
  ['cancel','auth_revoked'].forEach(n=>es.addEventListener(n,()=>setState('ditolak')));
}
function setAt(path,data,touched){
  const p=path.split('/').filter(Boolean);
  if(p.length<2){const before=rtKeys(sync.rt);if(!p.length)sync.rt=data||{};else if(data==null)delete sync.rt[p[0]];else sync.rt[p[0]]=data;before.concat(rtKeys(sync.rt)).forEach(k=>touched.add(k));return}
  let o=sync.rt;for(let i=0;i<p.length-1;i++){if(o[p[i]]==null||typeof o[p[i]]!=='object')o[p[i]]={};o=o[p[i]]}
  const last=p[p.length-1];if(data==null)delete o[last];else o[last]=data;touched.add(p[0]+'/'+p[1]);
}
function applyKey(t){
  const i=t.indexOf('/'),c=t.slice(0,i),id=t.slice(i+1);
  if(c==='settings'){const cur=db.settings[id],b=sync.base.get(t);if(sj(cur)!==(b?b.j:undefined))return false;
    let rv=sync.rt.settings?sync.rt.settings[id]:undefined;if(LIST_KEYS.includes(id))rv=arr(rv);
    const nj=sj(rv);if(nj===undefined){sync.base.delete(t)}else sync.base.set(t,{j:nj,v:rv});
    if(rv===undefined||sj(cur)===nj)return false;db.settings[id]=rv;return true}
  if(!COLS.includes(c)||!id)return false;
  const cur=db[c].find(x=>x.id===id),curJ=cur?sj(cur):undefined,b=sync.base.get(t);
  if(curJ!==(b?b.j:undefined))return false;
  const rec=sync.rt[c]&&sync.rt[c][id];
  if(!rec||typeof rec!=='object'){sync.base.delete(t);if(cur){db[c]=db[c].filter(x=>x.id!==id);return true}return false}
  const n=normRec(c,Object.assign({},rec,{id})),nj=sj(n);sync.base.set(t,{j:nj,v:n});
  if(nj===curJ)return false;if(cur)db[c][db[c].indexOf(cur)]=n;else db[c].push(n);return true;
}
function adoptAll(){
  const rt=sync.rt,s=Object.assign(defSettings(),rt.settings||{});if(rt.settings)LIST_KEYS.forEach(k=>{s[k]=arr(rt.settings[k])});
  const d={v:1,settings:s};COLS.forEach(c=>{d[c]=Object.entries(rt[c]||{}).filter(e=>e[1]&&typeof e[1]==='object').map(([id,r])=>normRec(c,Object.assign({},r,{id})))});
  db=d;sync.base=flatten(db);cacheLocal();
}
function onSse(e){
  let m;try{m=JSON.parse(e.data)}catch(x){return}if(!m||typeof m.path!=='string')return;
  if(sync.first){if(e.type==='put'&&m.path==='/'){sync.first=false;sync.rt=m.data||{};
      if(!Object.keys(sync.rt).length){sync.base=new Map();setState('online');schedulePush(0)}else{adoptAll();setState('online');scheduleRender()}}return}
  setState('online');const touched=new Set();
  if(e.type==='put')setAt(m.path,m.data,touched);
  else Object.keys(m.data||{}).forEach(k=>setAt((m.path==='/'?'':m.path)+'/'+k,m.data[k],touched));
  let ch=false;touched.forEach(t=>{if(applyKey(t))ch=true});
  if(ch){cacheLocal();scheduleRender()}
}
function scheduleRender(){clearTimeout(sync.rtimer);sync.rtimer=setTimeout(function go(){
  const a=document.activeElement;if(a&&a.closest&&a.closest('#app')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){sync.rtimer=setTimeout(go,1500);return}
  if(session&&session.role==='admin'&&!db.warga.some(w=>w.id===session.id&&w.admin)){act.keluar();return}
  render()},300)}
function schedulePush(d){if(!sync.es||sync.first)return;clearTimeout(sync.timer);sync.timer=setTimeout(pushNow,d==null?500:d)}
async function pushNow(){
  if(sync.pushing){sync.timer=setTimeout(pushNow,600);return}
  const b=syncBase();if(!b||!session||session.role==='viewer')return;
  const cur=flatten(db),patch={},sent=[];
  cur.forEach((e,k)=>{const o=sync.base.get(k);if(!o||o.j!==e.j){patch[k]=e.v;sent.push(k)}});
  sync.base.forEach((o,k)=>{if(!cur.has(k)){patch[k]=null;sent.push(k)}});
  if(!sent.length)return;sync.pushing=true;
  try{const r=await fetch(b+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)});
    if(!r.ok)throw new Error(String(r.status));
    sent.forEach(k=>{const e=cur.get(k);if(e)sync.base.set(k,e);else sync.base.delete(k)});setState('online')}
  catch(err){const st=String(err.message);setState(st==='401'||st==='403'?'ditolak':'offline');clearTimeout(sync.retry);sync.retry=setTimeout(pushNow,6000)}
  finally{sync.pushing=false}
}
function syncSection(){
  const c=sync.cfg||{url:'',kode:''};
  return `<section class="lembar"><h3>Sinkronisasi antar HP</h3><p>Status: <span class="syn ${sync.state} synT">${synLabel()}</span></p>
  <p>Data pengurus dan warga akan tersinkron otomatis lewat Firebase Realtime Database (gratis untuk skala RT). Siapkan sekali:</p>
  <ol class="lg"><li>Buka console.firebase.google.com, buat proyek, lalu Build → Realtime Database → Create database (mode terkunci).</li><li>Di tab Rules, ganti isinya dengan aturan di bawah, lalu Publish.</li><li>Salin alamat database (diawali https://) dan buat kode rahasia, isi di bawah, lalu klik Sambungkan.</li><li>Bagikan tautan undangan ke pengurus dan warga. File ini harus dipasang di hosting (mis. GitHub Pages, Netlify) supaya tautannya bisa dibuka di HP lain.</li></ol>
  <pre class="kode">${esc(RULES)}</pre>
  <div class="grid"><label class="fld"><span>Alamat database</span><input id="synUrl" type="url" placeholder="https://nama-proyek-default-rtdb.firebasedatabase.app" value="${esc(c.url)}"></label><label class="fld"><span>Kode rahasia RT (min. 8 karakter)</span><input id="synKode" type="text" autocomplete="off" value="${esc(c.kode)}"></label></div>
  <div class="acts" style="margin-top:10px">${btn('syncSimpan','Sambungkan','','utama')}${sync.cfg?btn('syncUndang','Tautan undangan')+btn('syncPutus','Putuskan','','bahaya'):''}</div>
  <p><small>Jika database sudah berisi data, data di HP ini diganti dengan data dari database. Perubahan yang belum terkirim saat HP offline bisa hilang bila halaman ditutup. Siapa pun yang tahu kode rahasia dapat membaca dan mengubah data langsung (termasuk PIN), jadi bagikan hanya ke warga RT ini.</small></p></section>`;
}
act.syncSimpan=()=>{
  const url=(($('#synUrl')||{}).value||'').trim(),kode=(($('#synKode')||{}).value||'').trim();
  if(!/^https:\/\/\S+$/.test(url))return toast('Alamat database harus diawali https://','err');
  if(kode.length<8||/[.$#\[\]\/\s]/.test(kode))return toast('Kode rahasia minimal 8 karakter, tanpa spasi dan simbol . $ # [ ] /','err');
  konfirm('Jika database sudah berisi data, data di HP ini akan diganti data dari database. Lanjutkan?',()=>{sync.cfg={url,kode};sset(CFGKEY,JSON.stringify(sync.cfg));startSync();render();toast('Menyambungkan…')},'Sambungkan');
};
act.syncPutus=()=>konfirm('Putuskan sinkronisasi di perangkat ini? Data di HP ini tetap ada.',()=>{stopSync();sync.cfg=null;sset(CFGKEY,'null');setState('mati');render()},'Putuskan');
act.syncUndang=()=>{if(!sync.cfg)return;const link=location.href.split('#')[0]+'#sync='+btoa(unescape(encodeURIComponent(JSON.stringify(sync.cfg))));
  $('#modal2').innerHTML=`<div class="ov"><div class="dlg"><div class="dh"><h3>Tautan undangan</h3><button class="x" data-act="tutup2" aria-label="Tutup">×</button></div><div class="db"><p>Kirim tautan ini ke HP lain. Tautan memuat kode rahasia, jadi jangan dibagikan di grup publik.</p><textarea rows="5" style="width:100%" readonly onfocus="this.select()">${esc(link)}</textarea></div></div></div>`};
(function(){try{const m=(location.hash||'').match(/#sync=(.+)$/);if(m){const c=JSON.parse(decodeURIComponent(escape(atob(m[1]))));if(c&&c.url&&c.kode){sset(CFGKEY,JSON.stringify(c));try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}}}catch(e){}
  try{sync.cfg=JSON.parse(sget(CFGKEY)||'null')}catch(e){sync.cfg=null}
  if(!sync.cfg&&SYNC_DEFAULT.url&&SYNC_DEFAULT.kode)sync.cfg=SYNC_DEFAULT})();

render();
startSync();
})();
</script>
